<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="icon" href="favicon.png">
<meta name="color-scheme" content="dark">
<!-- fond sombre tout de suite, avant le CSS (chargé par le JS) : pas d'écran blanc -->
<style>html, body { background: #14110e; }</style>
<!-- écran tactile (téléphone, tablette) : décidé tout de suite, avant le premier affichage -->
<script>
  if (navigator.maxTouchPoints > 0 && (matchMedia('(any-pointer: coarse)').matches || !matchMedia('(hover: hover)').matches
    || /Mobi|Android|iPhone|iPad/.test(navigator.userAgent))) document.documentElement.classList.add('is-touch');
</script>
<title>Behind the Mask</title>
<link rel="stylesheet" href="/src/styles/pages/game.css">
<script type="module" src="/src/pages/game.js"></script>
</head>
<body class="game">
<!-- la scène : l'écran et, sur téléphone, les commandes tactiles par-dessus. Tenu en portrait,
     le téléphone affiche le tout tourné d'un quart de tour : on joue forcément en paysage. -->
<main class="stage">
<div class="borne borne--game"><div class="borne__screen" id="screen"></div></div>
<div class="touch" aria-hidden="true">
  <div class="touch-stick" data-touch-stick><span class="touch-stick__knob"></span></div>
  <div class="touch-buttons">
    <label class="touch-btn"><button class="touch-btn__cap touch-btn__cap--grey" type="button" data-action="melee"></button><span>COUP</span></label>
    <label class="touch-btn"><button class="touch-btn__cap touch-btn__cap--grey" type="button" data-action="lock"></button><span>VISER</span></label>
    <label class="touch-btn"><button class="touch-btn__cap touch-btn__cap--blue" type="button" data-action="skate"></button><span>SKATE</span></label>
    <label class="touch-btn"><button class="touch-btn__cap touch-btn__cap--red" type="button" data-action="fire"></button><span>TIR</span></label>
    <label class="touch-btn"><button class="touch-btn__cap touch-btn__cap--yellow" type="button" data-action="jump"></button><span>SAUT</span></label>
    <label class="touch-btn"><button class="touch-btn__cap touch-btn__cap--white" type="button" data-action="bomb"></button><span>VINYLE</span></label>
  </div>
  <button class="touch-start" type="button" data-action="start">START</button>
</div>
</main>
<p class="help">
  <kbd>←→</kbd> avancer · <kbd>↑</kbd><kbd>↓</kbd> vers le fond / vers l'avant · <kbd>S</kbd> + <kbd>↑</kbd> viser en haut · <kbd>S</kbd> + <kbd>↓</kbd> s'accroupir<br>
  <kbd>W</kbd> tir · <kbd>X</kbd> saut · <kbd>C</kbd> vinyle · <kbd>Q</kbd> corps à corps · <kbd>D</kbd> attaque en skate · <kbd>ENTRÉE</kbd> start (pause)<br>
  en l'air et sur les plateformes, <kbd>↑</kbd><kbd>↓</kbd> visent · <kbd>↓</kbd> + saut : descendre d'une plateforme
</p>
<p class="help"><a href="galerie.html">galerie</a> · <a href="demo.html">banc d'essai</a></p>
</body>
</html>
